<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Tolaria telemetry</title>
        <!--
            Shell only (#2625). Styles live in scripts/dashboard/dashboard.css
            and behaviour in scripts/dashboard/*.js, served by
            telemetry-serve.ts from an explicit allow-list under /assets/.
            No build step: these are plain ES modules.
        -->
        <link rel="stylesheet" href="/assets/dashboard.css" />
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>Tolaria telemetry</h1>
                <span class="sub" id="meta-line">loading…</span>
                <button class="theme" id="theme">theme</button>
            </header>

            <!--
                Two explicit modes. Now is operations and reads only
                /api/loop-status (no database); History is analysis and reads
                the telemetry store. The active one lives in ?view=.
            -->
            <nav class="tabs" role="tablist" aria-label="Dashboard view">
                <button
                    class="tab"
                    id="tab-now"
                    type="button"
                    role="tab"
                    data-view="now"
                    aria-controls="view-now"
                    aria-selected="true"
                >
                    Now
                </button>
                <button
                    class="tab"
                    id="tab-history"
                    type="button"
                    role="tab"
                    data-view="history"
                    aria-controls="view-history"
                    aria-selected="false"
                >
                    History
                </button>
            </nav>

            <div
                class="view"
                id="view-now"
                role="tabpanel"
                aria-labelledby="tab-now"
            >
                <section class="card" id="loop-status-card">
                    <h2>Loop status</h2>
                    <div class="h-sub" id="loop-status-sub">loading…</div>
                    <div id="loop-status-body"></div>
                </section>
            </div>

            <div
                class="view"
                id="view-history"
                role="tabpanel"
                aria-labelledby="tab-history"
                hidden
            >
                <div class="filters" id="filters"></div>
                <div class="tiles" id="tiles"></div>

                <section class="card">
                    <h2>Issues</h2>
                    <div class="h-sub" id="issues-sub"></div>
                    <div class="row-filters" id="issues-filters"></div>
                    <div class="tbl-wrap"><table id="issues-tbl"></table></div>
                </section>

                <section class="card">
                    <h2>Sessions</h2>
                    <div class="h-sub">
                        One row per session in range. Click a header to sort, a
                        row for its agent runs.
                    </div>
                    <div class="row-filters" id="sessions-filters"></div>
                    <div class="tbl-wrap"><table id="sessions-tbl"></table></div>
                </section>

                <section class="card">
                    <h2>Family × role</h2>
                    <div class="h-sub">
                        Where time and tokens go, by issue family and agent
                        role.
                    </div>
                    <div class="tbl-wrap"><table id="families-tbl"></table></div>
                </section>

                <section class="card">
                    <h2 id="ts-title">Over time</h2>
                    <div class="h-sub" id="ts-sub"></div>
                    <div class="scroll"><svg id="ts"></svg></div>
                    <div class="legend" id="ts-legend"></div>
                </section>

                <section class="card">
                    <h2 id="rank-title">Ranking</h2>
                    <div class="h-sub" id="rank-sub"></div>
                    <div class="scroll"><svg id="rank"></svg></div>
                </section>

                <section class="card">
                    <h2>Table</h2>
                    <div class="h-sub" id="tbl-sub"></div>
                    <div class="tbl-wrap"><table id="tbl"></table></div>
                </section>
            </div>
        </div>
        <!-- Outside both views: the tooltip layer is position:fixed chrome. -->
        <div id="tip"></div>

        <script type="module" src="/assets/main.js"></script>
    </body>
</html>
