# Drop-in for EVERY Tolaria systemd unit on the Huawei (the health runner, the
# self-hosted Convex, the crons) — issue #5470. Install:
# docs/guides/huawei-runner.md § Every Tolaria unit.
[Service]
# When the unit stops, systemd kills its whole cgroup: whatever re-parented
# itself, whatever lost its tag.
KillMode=control-group
# A unit's tree is the unit's to end: the reaper never reaps on a `unit:` tag,
# and never mistakes the unit's processes (parent pid 1) for untagged orphans.
Environment=TOLARIA_OWNER=unit:%n
