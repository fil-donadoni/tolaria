# blade-robustness — the blade robustness audit before landing (issue #9361,
# ADR 0154 Amendment). `blade:robustness` (issue #4875) used to run only in a
# health batch AFTER the merge: a search change leaving a `must` entry
# noise-pinned landed green and reddened the base. Here the same audit runs on
# the PR, on free GitHub-hosted VMs, in parallel with hand-off — no pass waits
# on it and the `lane` runner is never loaded.
#
# One predicate: `scripts/blade-robustness-plan.ts` reads the health trigger
# (`lib/health-robustness-trigger.ts`) on the PR's diff — FULL (every `must`
# entry), INCREMENTAL (the registry's added or changed entries) or NONE. NONE
# runs no search and reports the check green, so the queue condition
# `check-success=blade-robustness` (`.mergify.yml`) is uniform.
#
# The audit is ~8.2M search iterations over 624 `must` entries (issue #10319):
# four single-worker shards ran past a 60-minute timeout on every FULL PR. The
# `audit` matrix is PARTS jobs; each runs all four `robustness.shard-N.spec.ts`
# files (the partition the `must` suite and health use) on the runner's four
# vCPUs, narrowed by `BLADE_ROBUSTNESS_PART=<part>/<PARTS>` to a cost-balanced
# part of each shard (`costBalancedSlice`). The part count is the matrix
# length (`strategy.job-total`), nowhere else. Measured on PR #10333 (run
# 44746367265): parts took 21-30 min, the one holding the Oko loyalty entry
# (1914 s alone) 61 min; `timeout-minutes: 120` is ~2x the slowest part.
#
# Mergify re-reads `queue_conditions` on its draft: the verdict job reports
# green there at once — the audit was proven on the PR's own head, and the
# draft is that head rebased.
#
# GitHub-hosted, no secret, read-only token, `persist-credentials: false`: a
# fork PR never reaches the owner's machines. Every context value reaches the
# shell through `env:`. docs/guides/github-pipeline.md § Workflows.
name: blade-robustness

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

# A newer push supersedes the audit of the older head (hosted only).
concurrency:
    group: blade-robustness-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    plan:
        name: audit plan
        if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        outputs:
            mode: ${{ steps.plan.outputs.mode }}
            labels: ${{ steps.plan.outputs.labels }}
        steps:
            # The merge ref (what would land), with the whole commit graph and
            # no historical blobs (~14 MB): the PR's own change is
            # `origin/<base>...<head>`, never the merge ref's `HEAD^1..HEAD` —
            # GitHub can hand out a merge ref on a base tip older than the PR's
            # fork point (issue #10319, PR #10295).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            - name: Plan
              id: plan
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              shell: bash
              run: bun scripts/blade-robustness-plan.ts

    shard:
        name: audit part ${{ matrix.part }}
        needs: plan
        if: ${{ needs.plan.outputs.mode != 'none' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                part: [0, 1, 2, 3, 4, 5, 6, 7]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            # A PR carries no derived state (ADR 0157): `land:ready` restores
            # data/catalogue/* to the merge-base, so the audited merge ref holds
            # the BASE's catalogue — a card the PR graduates is in its lockfile
            # rows but not in the packed corpus,
            # and a `must` entry naming it throws "Card not found by name"
            # (PR #10701). Re-pack from the tree's own rows, as the queue's
            # draft does (`derive:regenerate`); ~7 s, no corpus key needed.
            # Not rebuilt here: the lockfile header hashes (the audit never
            # reads them) and the Bot refit artefacts (~4 min a part; they
            # stay the base's, as before this step).
            - name: catalogue:pack (derived state of the tree)
              shell: bash
              run: bun run catalogue:pack
            - name: blade:robustness part
              env:
                  PART: ${{ matrix.part }}
                  BLADE_ROBUSTNESS: "1"
                  BLADE_ROBUSTNESS_LABELS: ${{ needs.plan.outputs.labels }}
                  BLADE_ROBUSTNESS_PART: ${{ matrix.part }}/${{ strategy.job-total }}
                  # Four spec files, four vCPUs: one worker each.
                  TOLARIA_VITEST_WORKERS: "4"
              shell: bash
              run: |
                  log="$RUNNER_TEMP/robustness-$PART.log"
                  start=$(date +%s)
                  set +e
                  # `tee`: a part cut by the timeout still leaves its per-entry
                  # rows in the job log.
                  set -o pipefail
                  bunx vitest run --config vitest.blade.config.ts "robustness.shard-" 2>&1 | tee "$log"
                  code=$?
                  set -e
                  # Which entry and which leg: the machine finding lines and the
                  # failed tests, into the run summary.
                  {
                      echo "### part $BLADE_ROBUSTNESS_PART (exit $code, $(( $(date +%s) - start )) s)"
                      echo '```'
                      grep -E '^\[blade:robustness:finding\]|FAIL|✗|×' "$log" | head -60 || true
                      echo '```'
                  } >>"$GITHUB_STEP_SUMMARY"
                  exit "$code"

    verdict:
        # The name the queue's condition reads (`check-success=blade-robustness`).
        name: blade-robustness
        needs: [plan, shard]
        if: ${{ always() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            - name: Verdict
              env:
                  HEAD_REF: ${{ github.head_ref }}
                  PLAN: ${{ needs.plan.result }}
                  MODE: ${{ needs.plan.outputs.mode }}
                  SHARD: ${{ needs.shard.result }}
              shell: bash
              run: |
                  case "$HEAD_REF" in
                      mergify/merge-queue/*)
                          echo "queue draft: audited on the PR's own head"; exit 0 ;;
                  esac
                  if [ "$PLAN" != success ]; then
                      echo "::error::audit plan $PLAN — the trigger could not be read"; exit 1
                  fi
                  if [ "$MODE" = none ]; then
                      echo "no audit owed (trigger: NONE)"; exit 0
                  fi
                  if [ "$SHARD" != success ]; then
                      echo "::error::blade robustness audit ($MODE) is $SHARD — see the shard summaries for the entry and leg"; exit 1
                  fi
                  echo "audit ($MODE) green on the PR head"
