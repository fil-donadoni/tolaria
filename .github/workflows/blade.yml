name: blade

# Blade-scenario suite (issue #1427, PRD #1423) — the bot-correctness metric.
# Deliberately its OWN workflow, separate from the fast unit suite: it runs the
# real ISMCTS search over full game states, and a failure here means "the bot
# got worse", not "a rule broke".
#
#   blade-must    — BLOCKING. Positions the bot is expected to get right today.
#   blade-stretch — REPORT-ONLY (continue-on-error). Positions we are working
#                   towards; the log records progress without gating a merge.

on:
    push:
        branches:
            - staging
            - main
    pull_request:
        branches:
            - staging
            - main

jobs:
    blade-must:
        name: blade (must — blocking)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Generate Convex types
              run: bunx convex codegen --typecheck disable
              env:
                  CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
                  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

            - name: Blade suite (must tier)
              run: bun run test:blade

    blade-stretch:
        name: blade (stretch — report only)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Generate Convex types
              run: bunx convex codegen --typecheck disable
              env:
                  CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
                  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

            - name: Blade suite (stretch tier)
              run: bun run test:blade:stretch
