# queue-lane — the check Mergify's queue runs: `check:lane` on the queue's
# draft branch (the PR rebased onto the tip), on one of the owner's `lane`
# runners (ADR 0156 Amendment I, issue #5640). A failed vitest command is
# re-run ONCE on its failing files; a green re-run leaves the check green and
# the flake in the job's JSON (`lane.json`, summarised in the job summary) —
# the same single retry health gives its vitest projects (issue #5461).
#
# Triggered only by a push to `mergify/merge-queue/**`, a branch only an
# account with write access can create: no outsider reaches the runner (the
# structure guard, scripts/__tests__/workflow-structure.test.ts). The job's
# name is the status context the queue rule requires.
#
# A red lane whose only cause is a stale generated artefact costs no pass
# (issue #5955): `pr:fixup classify --draft` reads the lane's JSON, finds the
# PR the draft is checking and dispatches `pr-fixup`, which regenerates,
# pushes and hands the PR (dequeued as `land-failed` meanwhile) back to the
# queue as `ready-to-land`. Any other red stays a repair pick.
# docs/guides/github-pipeline.md § queue-lane.
name: queue-lane

on:
    push:
        branches: ["mergify/merge-queue/**"]

permissions:
    contents: read

jobs:
    queue-lane:
        name: queue-lane
        runs-on: [self-hosted, lane]
        timeout-minutes: 60
        # A PR's newer draft cancels its older draft's run, running included:
        # Mergify re-creates the draft on a new branch and deletes the old
        # one, whose run would otherwise hold a `lane` runner the live draft
        # waits for (issue #6020). Keyed by the PR (the draft's head commit is
        # `Merge of #N`, batch size 1), never the branch; the sha is the
        # fallback, so a missing message never groups two PRs. Pinned by the
        # structure guard, rule `queue-superseded`.
        concurrency:
            group: queue-lane-${{ github.event.head_commit.message || github.sha }}
            cancel-in-progress: true
        # `actions: write` only to dispatch pr-fixup below, `pull-requests:
        # read` to find the PR behind the draft (issue #5955) — the same
        # pattern as pr-check's fixup step, on a same-repository draft whose
        # PR passed `trusted-author` to enter the queue.
        permissions:
            contents: read
            actions: write
            pull-requests: read
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: check:lane (one flaky re-run)
              # stderr teed to lane.log: a refusal leaves lane.json empty and
              # its reason there, for the fixup step (issue #6003).
              shell: bash
              run: bun run check:lane --json --retry-flaky 2>&1 >"$RUNNER_TEMP/lane.json" | tee "$RUNNER_TEMP/lane.log"
            - name: Flakes in the job summary
              if: always()
              run: bun run pr:fixup flakes --lane "$RUNNER_TEMP/lane.json" >> "$GITHUB_STEP_SUMMARY"
            - name: Fixup (stale generated artefact)
              if: failure()
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  DRAFT: ${{ github.ref_name }}
              run: bun run pr:fixup classify --lane "$RUNNER_TEMP/lane.json" --log "$RUNNER_TEMP/lane.log" --draft "$DRAFT"
            # The weekly report's record of this run: its flakes, and which
            # red dequeued the PR (issue #5651). Step ids, test file names
            # and timings only; an empty file is a refusal.
            - name: Upload the lane JSON
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: queue-lane-json
                  path: ${{ runner.temp }}/lane.json
                  if-no-files-found: ignore
                  retention-days: 14
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove
