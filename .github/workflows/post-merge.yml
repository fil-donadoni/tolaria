# post-merge — what a merge to the base obliges on the owner's machines (ADR
# 0156 Amendment I, issue #5644): on every machine, fast-forward the primary
# checkout, remove the merged PR's worktree and ingest the telemetry; on the
# `seed` machine, seed the PR's preset scenario (and every preset list when a
# card set changed); on ANY one lane runner, `housekeeping` (gaps:sync with its
# direct push, derive:sync — the base regenerates its lockfile header hashes and
# data/catalogue/* on the tip and pushes once, ADR 0157 / issue #6247, after
# playing the tip's Bot-verdict misses, ADR 0158 § 2b / issue #6687 — grammar
# residue, claim release, umbrella detach). Two schedules cover what no push
# triggers: housekeeping's hourly retry (and derive:sync's backstop for a push
# the base outran) and `health:nightly`. `sync` fast-forwards the primary only
# to a derived-fresh tip (`derive:sync --fresh` on the job worktree).
# `bot-replay` (issue #6463) is the ONE whole Bot-play sweep per Bot change:
# on every push and nightly it compares the lockfile header's Bot hash with the
# tree's (seconds, no push when equal) and on a mismatch replays every `ready`
# card once on that tip — pushing the swept lockfile when no card left `ready`,
# filing a regression issue when one did. A session's bare `oracle:compile`
# never replays for a Bot hash it did not move.
# They replace the Huawei's tolaria-housekeeping and tolaria-nightly timers.
# The hourly schedule also runs `sweep` on EVERY machine (issue #6083):
# worktrees are machine-local, so the issue worktrees no merge cleans up (PR
# closed unmerged, or no PR and no claim) are swept per host, like `sync`.
# No job requires one host (issue #5873): `housekeeping` and `nightly` keep
# their state in `refs/tolaria/state` and work in a worktree of their own, so
# a runner that is offline or broken costs nothing but its own `sync` leg.
#
# `branches:` names the base by literal because a workflow cannot read
# tolaria.config.json: renaming the base (ADR 0116) means editing this line
# (docs/guides/github-pipeline.md § post-merge). A schedule fires from the
# DEFAULT branch only, so the two schedule jobs start running once a release
# carries this file there. The `host` matrix names the machines by their
# `host:<name>` label (docs/guides/github-pipeline.md § The runners on a
# machine): a third machine means a third entry.
name: post-merge

on:
    push:
        branches: [staging]
    schedule:
        - cron: "17 * * * *"
        - cron: "40 3 * * *"
    workflow_dispatch:
        inputs:
            job:
                description: Job to run by hand
                type: choice
                options: [housekeeping, nightly, sweep, bot-replay]
                default: housekeeping

permissions:
    contents: read

jobs:
    sync:
        name: fast-forward, worktree cleanup, telemetry (${{ matrix.host }})
        if: ${{ github.event_name == 'push' }}
        runs-on: [self-hosted, lane, "host:${{ matrix.host }}"]
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                host: [macbook, huawei]
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: post-merge sync
              env:
                  BEFORE: ${{ github.event.before }}
              run: bun run post-merge sync --before "$BEFORE" --after "$GITHUB_SHA"
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    sweep:
        name: orphan issue-worktree sweep (${{ matrix.host }})
        if: ${{ github.event.schedule == '17 * * * *' || inputs.job == 'sweep' }}
        runs-on: [self-hosted, lane, "host:${{ matrix.host }}"]
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                host: [macbook, huawei]
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: post-merge sweep
              run: bun run post-merge sweep
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    seed:
        name: seed the preset scenario
        # No `needs: sync`: that waits for EVERY matrix leg, so a nightly holding
        # the Huawei's lane runner would delay the MacBook's seed for hours. The
        # script fast-forwards the seed machine's checkout itself (the seed
        # resolves card names against its disk, issue #3253) and refuses to
        # seed a stale tree.
        if: ${{ github.event_name == 'push' }}
        runs-on: [self-hosted, seed]
        # 25 min of waiting for derive:sync's commit on a stale tip (ADR 0157,
        # issue #6248, `SEED_DERIVE_WAIT_MS`) plus the seed itself.
        timeout-minutes: 40
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: post-merge seed
              env:
                  BEFORE: ${{ github.event.before }}
              run: bun run post-merge seed --before "$BEFORE" --after "$GITHUB_SHA"
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    housekeeping:
        name: housekeeping
        if: ${{ github.event_name == 'push' || github.event.schedule == '17 * * * *' || inputs.job == 'housekeeping' }}
        # Any lane runner (issue #5873): its state is shared and its work
        # happens in a throwaway worktree, so no host is required. One run at
        # a time across machines; a RUNNING run is never cancelled, a pending
        # one dropped loses nothing (the next run re-reads every fact).
        runs-on: [self-hosted, lane]
        concurrency:
            group: post-merge-housekeeping
            cancel-in-progress: false
        # Cost: seconds plus the workspace on the common run. derive:sync's
        # drift sweep (issue #6687) plays the tip's Bot-verdict misses first —
        # a few cards in place on a tip a PR played, the heavy mutex past
        # `LOCK_FREE_MISSES` (the MacBook's `land` waits behind it, as behind
        # the replay); the wall is its worst path, `DERIVE_SYNC_TIMEOUT_MS`
        # (160) plus the other steps. The miss count, played count and wall
        # land in this job's summary.
        timeout-minutes: 180
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: housekeeping
              run: bun run housekeeping
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    bot-replay:
        name: Bot-play replay on the base (one per Bot change)
        if: ${{ github.event_name == 'push' || github.event.schedule == '40 3 * * *' || inputs.job == 'bot-replay' }}
        # Any lane runner (issue #5873 — a pinned host offline holds the job
        # 24 h), like `nightly`'s Bot refresh, which is the same shape of work.
        # Cost (issue #6463): the sweep holds the heavy mutex (`gate.ts job`)
        # for 20–40 min on ONE core (the Bot plays one card at a time) — on
        # the MacBook that is the mutex `land` takes, so a landing waits
        # behind it, as it does behind any heavy run there; a pass runner
        # feels nothing, since a session's bare compile no longer queues for a
        # handful of misses. Seconds, no mutex, when the header's hash is the
        # tree's — the common push. One run at a time; a RUNNING run is never
        # cancelled (a sweep cut short is a sweep paid for nothing), a pending
        # one dropped loses nothing: the next push or the nightly re-reads the
        # two hashes. The job worktree is at $GITHUB_SHA — the DEFAULT
        # branch's sha on a schedule or a dispatch — so the script itself
        # moves to the base's fetched tip first; the worktree here is only the
        # tree it starts in. The wall is the worst path: sweep (120) + a
        # moved tip's bare compile (120) + oracle:index (30) + bootstraps and
        # packs.
        runs-on: [self-hosted, lane]
        concurrency:
            group: post-merge-bot-replay
            cancel-in-progress: false
        timeout-minutes: 300
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: derive:sync --replay-bot
              run: bun run derive:sync --replay-bot
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    nightly:
        name: health:nightly
        if: ${{ github.event.schedule == '40 3 * * *' || inputs.job == 'nightly' }}
        # Any lane runner (issue #5873); its record is shared state too.
        runs-on: [self-hosted, lane]
        concurrency:
            group: post-merge-nightly
            cancel-in-progress: false
        timeout-minutes: 360
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: health:nightly
              run: bun run health:nightly
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove
