# issue-band — a workflow bug is P0 (issue #6902, ADR 0143 Amendment VII), and
# so is a system-filed Bot fault (issue #9000, PRD issue #8998) and a user
# Bug Report (`user-report`, issue #9013, Amendment XII).
# When an issue is labelled and matches a rule of the P0 label table (an
# issue filed with its labels fires `labeled` too), `bun run issue:workflow-band` sets its board `Priority` to
# `P0` (idempotent; never lowers a band). The board write needs the machine's
# own gh login (a user project; the job token cannot write it), so it runs on
# the `seed` runner, idle between merges. `labeled` only: only a collaborator
# labels, so no outsider reaches the runner, and the job runs the base's
# script, never code from the issue. No `concurrency`: the script is
# idempotent, and a group would cancel a pending run.
name: issue-band
run-name: "issue-band #${{ github.event.issue.number }}"

on:
    issues:
        types: [labeled]

permissions:
    contents: read

jobs:
    band:
        name: P0 label rule → P0
        # One line per rule of `scripts/lib/p0-label-rules.ts`; a guard test
        # (`p0-label-rules.test.ts`) fails when the two disagree.
        if: >-
            ${{ (contains(github.event.issue.labels.*.name, 'bug') &&
            contains(github.event.issue.labels.*.name, 'area:workflow')) ||
            (contains(github.event.issue.labels.*.name, 'bug') &&
            contains(github.event.issue.labels.*.name, 'bot-fault')) ||
            (contains(github.event.issue.labels.*.name, 'user-report')) }}
        runs-on: [self-hosted, seed]
        timeout-minutes: 15
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: issue:workflow-band
              env:
                  ISSUE: ${{ github.event.issue.number }}
              run: env -u GITHUB_TOKEN -u GH_TOKEN bun run issue:workflow-band "$ISSUE"
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove
