# health — batch health on the owner's machines (ADR 0156 Amendment I,
# issue #5645): every two hours `health-main` gates the base tip on a `lane`
# runner (`--scheduled`: the offline gate, one re-run of a failed vitest
# project, INFRA classification, the evidence), and writes the verdict as the
# `health` commit status. A RED standing on the store goes up the ladder in
# the same job: a fresh run of its failing files at the same sha, then of
# every gate its run never reached — all green, the RED closes as GREEN and
# the flaky test is filed; reproduced, the bisect names the culprit PR in the
# evidence (scripts/health-bisect.ts). A RED is climbed once. Its next
# rungs — revert the named culprit FIRST (ADR 0158 § 3), fix forward only
# when the revert conflicts or no culprit is named, stop — are health-fix.yml's,
# dispatched to this machine whenever one is owed (issue #5646).
#
# `job: ladder` is the same ladder for a RED someone else found:
# health-early.yml (a GitHub-hosted run after a batch of merges) dispatches
# it with the RED's sha. `job: gate` is also dispatched by event (ADR 0159
# § 4): health-early's `classify` sends it when a declared repair merges and
# when the base has landed a batch (`LANDINGS_PER_BATCH`) with no verdict —
# the two-hourly schedule is the fallback, not the clock that decides GREEN. Every job re-dispatches `pr-gate` when it is done, so
# the queue's `base-health` follows the verdict. A RED left standing fails the
# job: GitHub's failed-run email is the owner's notice.
#
# A schedule fires from the DEFAULT branch only, and a dispatch needs the file
# there too: both start once a release carries this file (as post-merge's
# schedules). `--ref staging` names the base by literal for the same reason
# as post-merge's `branches:` (docs/guides/github-pipeline.md § health).
name: health

on:
    schedule:
        - cron: "50 */2 * * *"
    workflow_dispatch:
        inputs:
            job:
                description: "gate = health on the base tip; ladder = flake check + bisect of the RED at `sha`"
                type: choice
                options: [gate, ladder]
                default: gate
            sha:
                description: "ladder only: the RED's full sha"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    gate:
        name: health (base tip)
        if: ${{ github.event_name == 'schedule' || inputs.job == 'gate' }}
        runs-on: [self-hosted, lane]
        # One gate at a time across machines (ADR 0159 § 4): the gate is
        # dispatched by event too — a repair merged, a batch of landings
        # with no verdict (health-early's `classify`) — and two in flight
        # would prove one tip twice; a pending run dropped loses nothing,
        # the next run re-reads the tip.
        concurrency:
            group: health-gate
            cancel-in-progress: false
        timeout-minutes: 300
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: health-main (offline gate)
              id: health
              continue-on-error: true
              run: bun run health --scheduled --retry-infra
            # Always: the RED standing on the store may be another run's whose
            # ladder never ran (a lost dispatch). A RED already climbed is not
            # climbed again — one email per RED.
            - name: RED ladder (flake check, bisect)
              id: ladder
              if: always()
              continue-on-error: true
              run: bun run health:bisect ladder
            # The ladder's next rungs (issue #5646): revert first, fix
            # forward only where a revert cannot (ADR 0158 § 3), stop — on this machine, which saw the RED. Asked every run, so
            # a lost dispatch is re-sent; a rung in flight waits.
            - name: Next rung (fix, revert, stop)
              id: rung
              if: always()
              continue-on-error: true
              run: bun run health:fix ladder --dry-run
            - name: Dispatch health-fix
              if: ${{ always() && contains(fromJSON('["fix","revert","stop"]'), steps.rung.outputs.rung) }}
              continue-on-error: true
              run: gh workflow run health-fix.yml --ref staging -f host="$(bun run --silent health:fix host)"
            - name: Re-gate the queue
              if: always()
              continue-on-error: true
              run: gh workflow run pr-gate.yml --ref staging
            - name: Verdict
              if: ${{ steps.ladder.outcome != 'success' }}
              run: |
                  echo "::error::health is RED or INFRA on the base tip — bun run health:status"
                  exit 1
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove

    ladder:
        name: RED ladder (${{ inputs.sha }})
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'ladder' }}
        # A `pass` runner, as health-fix's: the merge queue's drafts saturate
        # the `lane` runners then, and a published RED waited 35-43 min for
        # one (issue #6553). `health:fix host` names this runner's machine.
        runs-on: [self-hosted, pass]
        timeout-minutes: 180
        steps:
            - name: Job worktree
              shell: bash
              working-directory: ${{ runner.temp }}
              run: |
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" fetch --no-tags --no-write-fetch-head --quiet origin "$GITHUB_SHA"
                  git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- create
            - uses: ./.github/actions/job-setup
            - name: RED ladder (flake check, bisect)
              id: ladder
              continue-on-error: true
              env:
                  SHA: ${{ inputs.sha }}
              run: bun run health:bisect ladder --sha "$SHA"
            - name: Next rung (fix, revert, stop)
              id: rung
              if: always()
              continue-on-error: true
              run: bun run health:fix ladder --dry-run
            - name: Dispatch health-fix
              if: ${{ always() && contains(fromJSON('["fix","revert","stop"]'), steps.rung.outputs.rung) }}
              continue-on-error: true
              env:
                  SHA: ${{ inputs.sha }}
              run: gh workflow run health-fix.yml --ref staging -f sha="$SHA" -f host="$(bun run --silent health:fix host)"
            - name: Re-gate the queue
              if: always()
              continue-on-error: true
              run: gh workflow run pr-gate.yml --ref staging
            - name: Verdict
              if: ${{ steps.ladder.outcome != 'success' }}
              run: |
                  echo "::error::the RED stands — bun run health:status --evidence"
                  exit 1
            - name: Remove the job worktree
              if: always()
              shell: bash
              working-directory: ${{ runner.temp }}
              run: git -C "$TOLARIA_PRIMARY_CHECKOUT" show "$GITHUB_SHA:scripts/ci/job-worktree.sh" | bash -s -- remove
