# pr-check — the full `check:lane` when a PR opens or updates, on a free
# GitHub-hosted runner (ADR 0156 Amendment I § Duties, issue #5636). ADVISORY:
# no ruleset requires it; `land` still pays the lane that gates the merge. It
# runs on the merge ref — the PR merged into the current base, what would land.
#
# The `land` refusals run here too, one job per check (issue #5639): the
# check:ui receipt, the preset scenario, the retired rows, the robustness
# baseline and the repair proof — `scripts/pr-checks.ts`, the same pure
# functions `land` calls. A red one on a queue PR makes it a repair pick
# (`.mergify.yml`, issue #5960); four read the PR body, so an `edited` event
# re-runs them.
#
# GitHub-hosted on purpose: a `pull_request` can come from a fork, and no job
# an outsider can trigger ever reaches the owner's machines (the structure
# guard, scripts/__tests__/workflow-structure.test.ts). No secret, read-only
# token. docs/guides/github-pipeline.md § Workflows.
name: pr-check

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read
    # repair-proof reads the health RED from commit statuses (issue #5639).
    statuses: read

# A newer push supersedes the lane of the older one (hosted only: a self-hosted
# workflow is serialised by runner labels, never by a concurrency group).
concurrency:
    group: pr-check-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    lane:
        name: check:lane (advisory)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        # `actions: write` only to dispatch pr-fixup below (issue #5640).
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            - name: check:lane (one flaky re-run)
              # No Verdict Store read key here (ADR 0156 §8: no secret in a
              # PR job), so the committed-corpus tests skip — the one
              # recorded hosted exclusion (issue #5675); `land`'s lane runs
              # them, and refuses to start with this set.
              env:
                  TOLARIA_HOSTED_NO_VERDICT_CORPUS: "1"
              run: bun run check:lane --json --retry-flaky > "$RUNNER_TEMP/lane.json"
            - name: Flakes in the job summary
              if: always()
              run: bun run pr:fixup flakes --lane "$RUNNER_TEMP/lane.json" >> "$GITHUB_STEP_SUMMARY"
            # A red lane whose only failing step is a stale generated artefact
            # (issue #5640): dispatch pr-fixup, which regenerates and pushes.
            # Same-repository PRs only — a fork's token cannot dispatch, and
            # pr-fixup refuses a fork anyway.
            - name: Fixup (stale generated artefact)
              if: failure() && github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: bun run pr:fixup classify --lane "$RUNNER_TEMP/lane.json" --pr "$PR" --ref "$BASE_REF"

    refusals:
        name: ${{ matrix.check }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                check:
                    - ui-receipt
                    - scenario
                    - retired-rows
                    - robustness-baseline
                    - repair-proof
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            - name: pr:checks ${{ matrix.check }}
              env:
                  PR_BODY: ${{ github.event.pull_request.body }}
                  GH_TOKEN: ${{ github.token }}
              run: bun run pr:checks ${{ matrix.check }}
