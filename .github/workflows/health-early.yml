# health-early — early detection on a free GitHub-hosted runner (ADR 0156
# Amendment I, issue #5645): after a merge batch, `health-main --early` runs
# the offline health gate on the base tip, so fewer PRs separate the last
# GREEN from a RED than the two-hourly health.yml alone would leave.
#
# A hosted runner holds no corpus reader key (issue #5675), so the run skips
# the committed-corpus tests — and a run that skipped tests proves no GREEN:
# only its RED reaches the `health` commit status (`storesVerdict`,
# scripts/lib/health-verdict-job.ts). That RED holds the queue at once
# (`base-health`, re-dispatched below — a status written with the job's
# token fires no `status` event) and dispatches health.yml's ladder on a
# `lane` runner, which re-runs it fresh, closes a flake GREEN, or bisects.
# A fresh pass on `lane` is never a flake here: the RED ran on another
# runner class, so it stands as environment-dependent (issue #5858) — the
# verdict's `github-hosted/` machine name is what tells the ladder.
#
# A derived-stale tip within `derive:sync`'s grace (ADR 0157, issue #6248)
# is `pending`: `last.json` says so, nothing was gated, no RED is dispatched
# below — the derive commit's own push starts the run that gates its tip.
# Stale past the grace is a RED at step `derive:sync`, handled like any RED.
#
# The batch: one run at a time, and the pushes that land while it runs
# collapse into ONE pending run of the newest tip (a concurrency group keeps
# one pending run and cancels the older pending one — the batching wanted
# here, never on a self-hosted job: docs/guides/github-pipeline.md
# § Serialising heavy work). Hosted only, so the corpus exclusion may appear
# here (the structure guard's `corpus-exclusion-gating`). No secret: the
# job's own token.
#
# A push that merges a DECLARED REPAIR of the standing RED (issue #6553) is
# the exception, decided by `classify` in seconds: the run of a superseded tip
# can only report the same RED, so the repair's run takes its own group and
# starts at once instead of waiting ~20 min behind it, and the merge
# dispatches health.yml's full `gate` on the new tip — this run never writes a
# GREEN, and without the dispatch only the two-hourly cron would clear the RED.
# `classify` dispatches the same `gate` when the base has landed one batch
# (`LANDINGS_PER_BATCH`, ADR 0154) since its newest verdict with no run in
# flight (ADR 0159 § 4, issue #6990): GREEN by event, the `50 */2` cron the
# fallback.
name: health-early

on:
    push:
        branches: [staging]

permissions:
    contents: read

jobs:
    classify:
        name: declared repair?
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            statuses: read
            pull-requests: read
            actions: write
        outputs:
            repair: ${{ steps.repair.outputs.repair }}
            due: ${{ steps.due.outputs.due }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            # Total: a failed read answers "not a repair" (the serial batching).
            - name: Does this push merge a declared repair of the standing RED?
              id: repair
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ github.sha }}
              run: bun run health:repair-merged --sha "$SHA"
            # Total too: a failed read answers "not due" (the cron's turn).
            - name: Has the base landed a batch with no verdict?
              id: due
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ github.sha }}
              run: bun run health:batch-due --sha "$SHA"
            # A merged repair needs the full gate on its tip at once (no
            # `land` merge step under Mergify fires it); so does a batch
            # landed with no verdict (ADR 0159 § 4).
            - name: Repair merged or batch due → the full health gate on the new tip
              if: ${{ steps.repair.outputs.repair == 'true' || steps.due.outputs.due == 'true' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run health.yml --ref staging -f job=gate

    early:
        name: health (early, hosted)
        needs: classify
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 150
        # One run at a time per group; a declared repair's tip has its own.
        concurrency:
            group: health-early${{ needs.classify.outputs.repair == 'true' && '-repair' || '' }}
            cancel-in-progress: false
        # `contents: write` for the RED's evidence (a commit comment),
        # `statuses: write` for the verdict, `actions: write` to dispatch the
        # ladder and the re-gate.
        permissions:
            contents: write
            statuses: write
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/job-setup
            - name: health-main --early (offline gate, no corpus)
              id: health
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  TOLARIA_HOSTED_NO_VERDICT_CORPUS: "1"
              run: bun run health --early
            - name: Read the run's record
              id: verdict
              if: always()
              run: |
                  f=.claude/telemetry/health/last.json
                  if [ -f "$f" ]; then
                      jq -r '"sha=\(.sha)", "status=\(.status)"' "$f" >> "$GITHUB_OUTPUT"
                  fi
            - name: RED → the ladder on a lane runner, and re-gate the queue
              if: ${{ steps.verdict.outputs.status == 'red' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ steps.verdict.outputs.sha }}
              # The re-gate first: it is what holds the queue. The ladder's
              # dispatch fails until a release carries health.yml to the default
              # branch — the next scheduled run climbs the standing RED then.
              run: |
                  gh workflow run pr-gate.yml --ref staging
                  gh workflow run health.yml --ref staging -f job=ladder -f sha="$SHA" ||
                      echo "::warning::the ladder could not be dispatched — health.yml's next run climbs this RED"
