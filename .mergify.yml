# The merge queue (ADR 0156 §3 and §8, Amendment I; issue #5642) — SHADOW
# phase: Mergify queues only a PR the owner labelled `queue:shadow`; the
# land-runner skips those (`planTick`), so each PR has exactly one merger.
# Cut-over drops the `queue:shadow` condition and retires the land-runner.
#
# Mergify reads this file from the BASE branch: a PR cannot loosen the rules
# it is judged by, and a PR touching `.github/` or this file never enters the
# queue (the owner merges it by hand). The structure guard pins the shape:
# scripts/ci/workflow-structure.ts, rules `queue-entry`, `queue-merge`,
# `queue-shape`, `queue-dequeue`. docs/guides/github-pipeline.md § The merge
# queue.

merge_queue:
    # Two speculative checks, one per machine (ADR 0156 §3: 16.0 PR/h).
    max_parallel_checks: 2
    # The repair pick reads `land-failed` (below), never Mergify's default
    # `dequeued` label.
    dequeued_label: null
    # Mergify's own comment on a dequeued PR carries the failing check.
    status_comments: outcomes

merge_protections_settings:
    # Queue a PR as soon as it is labelled; the queue rule's
    # `queue_conditions` decide whether it may enter.
    auto_merge_conditions:
        - label=queue:shadow
        - label=ready-to-land

queue_rules:
    - name: default
      queue_conditions:
          - label=queue:shadow
          - label=ready-to-land
          - -label=land-failed
          - check-success=trusted-author
          - check-success=base-health
          - -files~=^\.github/
          - -files=.mergify.yml
      # The queue's draft (the PR rebased onto the tip) owes only the lane;
      # the entry gates were proven on the PR itself, and Mergify's draft PRs
      # carry no `trusted-author` of their own.
      merge_conditions:
          - check-success=queue-lane
      # No batches: at a 15 % red rate a batch holds a bad PR more often than
      # it saves a run (ADR 0156 §3).
      batch_size: 1
      merge_method: squash

pull_request_rules:
    - name: a PR the queue rejects is a repair pick
      conditions:
          - or:
                - queue-dequeue-reason=checks-failed
                - queue-dequeue-reason=checks-timeout
      actions:
          label:
              add:
                  - land-failed
              remove:
                  - ready-to-land
          comment:
              message: |
                  **merge queue: dequeued (`{{ queue_dequeue_reason }}`)** — labelled `land-failed`.

                  The failing check: [`queue-lane` runs on the queue's drafts](https://github.com/fil-donadoni/tolaria/actions/workflows/queue-lane.yml?query=branch%3Amergify%2Fmerge-queue) — the run on this PR's draft is the one linked from Mergify's dequeue comment above.
