# The merge queue (ADR 0156 §3 and §8, Amendment I; issue #5642). Since the
# cut-over (issue #5643) Mergify is the only merger of a `ready-to-land` PR
# and the land-runner is retired. `land:ready` adds `merge:manual` to a PR
# the queue refuses: a marker `pr-refresh` reads (issues #5983, #6213), never
# a condition here.
#
# Mergify reads this file from the BASE branch: a PR cannot loosen the rules
# it is judged by, and a PR touching `.github/` or this file never enters the
# queue: the owner merges it by hand. The structure guard pins the shape:
# scripts/ci/workflow-structure.ts, rules `queue-entry`, `queue-merge`,
# `queue-shape`, `queue-dequeue`. docs/guides/github-pipeline.md § The merge
# queue.

merge_queue:
    # Two speculative checks, one per machine (ADR 0156 §3: 16.0 PR/h).
    max_parallel_checks: 2
    # A commit pushed to the base outside the queue (`gaps:sync` today,
    # `derive:sync` of ADR 0157 Option 1b) must not reset the queued drafts:
    # Mergify's default `always` cancelled a draft 18 s after one (issue
    # #6245). The draft is rebased on the tip it was cut from; the derived
    # commit touches generated files the lane re-derives anyway.
    reset_on_external_merge: never
    # The repair pick reads `land-failed` (below), never Mergify's default
    # `dequeued` label.
    dequeued_label: null
    # Mergify's own comment on a dequeued PR carries the failing check.
    status_comments: outcomes

merge_protections_settings:
    # Queue a PR as soon as it is labelled; the queue rule's
    # `queue_conditions` decide whether it may enter.
    auto_merge_conditions:
        - label=ready-to-land

queue_rules:
    - name: default
      queue_conditions:
          - label=ready-to-land
          - -label=land-failed
          # A PR whose own advisory lane is already red would only red the
          # draft behind it (issue #5643). Self-healing: a `pr-fixup` push
          # re-runs it on the new head. `pr-check` skips the queue's drafts,
          # so this condition never dequeues a queued PR (issue #5978).
          - -check-failure=check:lane (advisory)
          - check-success=trusted-author
          - check-success=base-health
          - -files~=^\.github/
          - -files=.mergify.yml
      # The queue's draft (the PR rebased onto the tip) owes only the lane;
      # the entry gates were proven on the PR itself. Mergify re-checks the
      # entry conditions' checks on the draft while a PR is queued, so
      # `pr-gate` posts both green on a draft (issue #5978).
      merge_conditions:
          - check-success=queue-lane
      # No batches: at a 15 % red rate a batch holds a bad PR more often than
      # it saves a run (ADR 0156 §3).
      batch_size: 1
      merge_method: squash

pull_request_rules:
    #
    # Not when `base-health` is red on the PR: a RED on the base is a hold,
    # not the PR's red (issue #6110). The PR keeps `ready-to-land`, and the
    # GREEN's re-gate (`pr-gate`) requeues it. A `queue-lane` red leaves
    # `base-health` green, so it stays a repair pick.
    # `queue:held` outlives the RED: once `base-health` is green again the
    # dequeue reason still stands until the PR is requeued, and the rule
    # above would match. `pr-gate` removes the label when it requeues.
    - name: a dequeue under a RED is a hold
      conditions:
          - check-failure=base-health
          - or:
                - queue-dequeue-reason=checks-failed
                - queue-dequeue-reason=checks-timeout
      actions:
          label:
              add:
                  - queue:held
    - name: a PR the queue rejects is a repair pick
      conditions:
          - -check-failure=base-health
          - -label=queue:held
          - or:
                - queue-dequeue-reason=checks-failed
                - queue-dequeue-reason=checks-timeout
      actions:
          label:
              add:
                  - land-failed
              remove:
                  - ready-to-land
          comment:
              message: |
                  **merge queue: dequeued (`{{ queue_dequeue_reason }}`)** — labelled `land-failed`.

                  The failing check: [`queue-lane` runs on the queue's drafts](https://github.com/fil-donadoni/tolaria/actions/workflows/queue-lane.yml?query=branch%3Amergify%2Fmerge-queue) — the run on this PR's draft is the one linked from Mergify's dequeue comment above.
    # `land`'s refusals cannot be queue conditions: Mergify judges those on
    # the queue's draft, whose body is Mergify's, so the four that read the
    # PR body would dequeue every PR (issue #5978). `land:ready` runs them
    # before the hand-off (issue #5956); one red after it (a body edit, a
    # push) is the same repair pick as a dequeue (issue #5960).
    #
    # A red advisory lane on the PR's head is the same pick (issue #5643).
    # The entry's `-check-failure` holds while the lane is still pending, so
    # a PR can enter first and go red after: this rule labels it
    # `land-failed` then, instead of leaving it dequeued on a failed
    # condition with no repair pick (issue #5978's stranding). A draft
    # carries no `ready-to-land`, so this rule never fires on one.
    #
    # Not under a RED: the lane tests the PR merged with the base, so a RED
    # reds every PR's lane, and that red is the base's (issue #6256). The rule
    # below holds the PR instead; `pr-gate`'s GREEN re-runs its lane and
    # requeues it.
    - name: a red land refusal on a queue PR is a repair pick
      conditions:
          - label=ready-to-land
          - -check-failure=base-health
          - -label=queue:held
          - or:
                - check-failure=check:lane (advisory)
                - check-failure=ui-receipt
                - check-failure=scenario
                - check-failure=retired-rows
                - check-failure=robustness-baseline
                - check-failure=repair-proof
      actions:
          label:
              add:
                  - land-failed
              remove:
                  - ready-to-land
          comment:
              message: |
                  **merge queue: a `land` refusal is red on this PR** — labelled `land-failed`.

                  The red check is one of `pr-check`'s refusal jobs (see the PR's checks). Fix the PR — a body edit re-runs them — then `bun run land:ready <PR#>`.
    - name: a red advisory lane under a RED is a hold
      conditions:
          - label=ready-to-land
          - check-failure=base-health
          - check-failure=check:lane (advisory)
      actions:
          label:
              add:
                  - queue:held
